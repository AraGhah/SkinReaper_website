<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0A">
<title>Skinreaper — Tattoo artist, Montréal</title>
<meta name="description" content="Skinreaper, tattoo artist at Velours Tattoo, 3455 Saint-Laurent Blvd, Montréal. Cybersigilism, neo-tribal and custom lettering. Book a session online.">
<script src="./support.js"></script>
<script src="./image-slot.js"></script>
</head>
<body>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@300;400;500;600&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; background: #0A0A0A; }
  body { margin: 0; background: #0A0A0A; color: #F2F2F0; -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; }
  button { font: inherit; }
  ::selection { background: #F2F2F0; color: #0A0A0A; }
  :focus-visible { outline: 2px solid #F2F2F0; outline-offset: 3px; }
  a:hover, button:not(:disabled):hover { opacity: .82; }
  textarea::placeholder, input::placeholder { color: #6E6E6B; }
  [data-slot] { cursor: pointer; }
  [data-slot][data-over] { outline: 2px dashed #F2F2F0; outline-offset: -8px; }

  /* Page load */
  .sr-nav-in { animation: sr-drop .8s cubic-bezier(.2,.7,.2,1) both; }
  .sr-line { display: block; overflow: hidden; padding-bottom: .02em; }
  .sr-line > span { display: block; animation: sr-line 1s cubic-bezier(.2,.7,.2,1) both; }
  .sr-zoom { animation: sr-zoom 1.8s cubic-bezier(.2,.7,.2,1) both; }
  .sr-fade { animation: sr-fade .9s ease both; }
  .sr-fadein { animation: sr-fadein .3s ease both; }

  /* Booking */
  .sr-step { animation: sr-drop-sm .5s cubic-bezier(.2,.7,.2,1) both; }
  .sr-pop { animation: sr-pop .35s cubic-bezier(.3,1.6,.5,1) both; }
  .sr-month { animation: sr-month .4s ease both; }
  .sr-slot { animation: sr-drop-sm .4s ease both; }
  .sr-check path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: sr-draw .7s .25s ease forwards; }
  .sr-spin { animation: sr-spin 1s linear infinite; }

  /* Mobile */
  .sr-bar { animation: sr-barup .6s .3s cubic-bezier(.2,.7,.2,1) both; }
  .sr-menu-in { animation: sr-fadein .25s ease both; }

  /* Scroll reveals, only where scroll timelines exist */
  @supports (animation-timeline: view()) {
    .rv { animation: sr-up linear both; animation-timeline: view(); animation-range: entry 0% entry 70%; }
    .rv-wipe { animation: sr-wipe linear both; animation-timeline: view(); animation-range: entry 0% entry 85%; }
    .rv-photo { animation: sr-photo linear both; animation-timeline: view(); animation-range: entry 0% cover 40%; }
    .rv-row { animation: sr-row linear both; animation-timeline: view(); animation-range: entry 0% entry 80%; }
  }

  @keyframes sr-drop { from { transform: translateY(-100%); opacity: 0; } }
  @keyframes sr-drop-sm { from { transform: translateY(-14px); opacity: 0; } }
  @keyframes sr-line { from { transform: translateY(105%); } }
  @keyframes sr-zoom { from { transform: scale(1.18); } }
  @keyframes sr-fade { from { opacity: 0; transform: translateY(16px); } }
  @keyframes sr-fadein { from { opacity: 0; } }
  @keyframes sr-pop { from { transform: scale(.7); } }
  @keyframes sr-month { from { opacity: 0; transform: translateX(18px); } }
  @keyframes sr-draw { to { stroke-dashoffset: 0; } }
  @keyframes sr-spin { to { transform: rotate(360deg); } }
  @keyframes sr-barup { from { transform: translateY(110%); } }
  @keyframes sr-up { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: none; } }
  @keyframes sr-wipe { from { clip-path: inset(100% 0 0 0); transform: translateY(40px); } to { clip-path: inset(0); transform: none; } }
  @keyframes sr-photo { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
  @keyframes sr-row { from { opacity: 0; transform: translateX(-32px); } to { opacity: 1; transform: none; } }

  .sr-rm *, .sr-rm *::before, .sr-rm *::after {
    animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important;
    animation-timeline: auto !important; transition-duration: .01ms !important;
  }
  .sr-rm .sr-spin { animation: none !important; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important;
      animation-timeline: auto !important; transition-duration: .01ms !important;
    }
  }
</style>
</helmet>

<x-dc><template>
<div id="top" class="{{ rootClass }}" style="{{ s.root }}">

  <!-- NAV -->
  <header class="sr-nav-in" style="{{ navStyle }}">
    <div style="{{ s.navInner }}">
      <a href="#top" on-click="closeMenu()" style="{{ s.logo }}" aria-label="Skinreaper">Skin<span style="color:#6E6E6B;">reaper</span></a>
      <sc-if test="d">
        <nav aria-label="Main" style="display:flex;gap:26px;align-items:center;">
          <sc-for each="navDesktop" as="l"><a href="#{{ l.id }}" style="{{ s.navLink }}">{{ l.label }}</a></sc-for>
        </nav>
      </sc-if>
      <div style="display:flex;align-items:center;gap:{{ d ? 16 : 8 }}px;">
        <div role="group" aria-label="Language / Langue" style="{{ s.langWrap }}">
          <button type="button" on-click="setLang('en')" lang="en" aria-pressed="{{ lang === 'en' ? 'true' : 'false' }}" style="{{ lang === 'en' ? s.langOn : s.langOff }}">EN</button>
          <button type="button" on-click="setLang('fr')" lang="fr" aria-pressed="{{ lang === 'fr' ? 'true' : 'false' }}" style="{{ lang === 'fr' ? s.langOn : s.langOff }}">FR</button>
        </div>
        <sc-if test="d"><a href="#book" style="{{ s.navCta }}">{{ t.nav.book }}</a></sc-if>
        <sc-else><button type="button" on-click="toggleMenu()" aria-expanded="{{ menuOpen ? 'true' : 'false' }}" aria-controls="sr-menu" style="{{ s.menuBtn }}">{{ menuOpen ? t.nav.close : t.nav.menu }}</button></sc-else>
      </div>
    </div>
  </header>

  <sc-if test="!d && menuOpen">
    <div id="sr-menu" class="sr-menu-in" role="dialog" aria-modal="true" aria-label="{{ t.nav.menu }}" style="{{ s.menu }}">
      <nav aria-label="Main" style="display:flex;flex-direction:column;">
        <sc-for each="navMobile" as="l"><a href="#{{ l.id }}" on-click="closeMenu()" class="sr-slot" style="{{ s.menuLink }};animation-delay:{{ i * 0.04 }}s">{{ l.label }}</a></sc-for>
      </nav>
      <div style="display:grid;gap:10px;margin-top:40px;">
        <a href="#book" on-click="closeMenu()" style="{{ s.btn }}">{{ t.hero.cta }}</a>
        <a href="{{ IG_URL }}" target="_blank" rel="noopener" style="{{ s.btnGhost }}">Instagram</a>
      </div>
    </div>
  </sc-if>

  <main>
    <!-- HERO -->
    <section id="hero" style="{{ s.hero }}">
      <div style="{{ s.wrap }}{{ s.heroGrid }}">
        <div>
          <p class="sr-fade" style="{{ s.kicker }};animation-delay:.15s">{{ t.hero.kicker }}</p>
          <h1 style="{{ s.h1 }}" aria-label="{{ t.hero.lines.join(' ') }}">
            <sc-for each="t.hero.lines" as="line"><span class="sr-line" aria-hidden="true"><span style="animation-delay:{{ 0.25 + i * 0.12 }}s">{{ line }}</span></span></sc-for>
          </h1>
          <p class="sr-fade" style="{{ s.lead }};margin-top:28px;animation-delay:.7s">{{ t.hero.sub }}</p>
          <div class="sr-fade" style="display:flex;flex-wrap:wrap;gap:12px;margin-top:34px;animation-delay:.85s">
            <a href="#book" style="{{ s.btn }}">{{ t.hero.cta }}</a>
            <a href="#work" style="{{ s.btnGhost }}">{{ t.hero.cta2 }}</a>
          </div>
          <ul class="sr-fade" style="{{ s.heroMeta }};animation-delay:1s">
            <sc-for each="t.hero.meta" as="m"><li>{{ m }}</li></sc-for>
          </ul>
        </div>
        <div style="{{ s.heroMedia }}">
          <div style="{{ s.heroPar }}">
            <sc-if test="heroImg.missing">
              <div data-slot="{{ heroImg.path }}" role="button" tabindex="0" aria-label="{{ t.slot.drop }}" style="{{ s.slot }}"><span>{{ t.slot.drop }}</span><span style="opacity:.6">{{ heroImg.path }}</span></div>
            </sc-if>
            <sc-else><img class="sr-zoom" src="{{ heroImg.src }}" alt="{{ t.hero.alt }}" fetchpriority="high" style="{{ s.cover }}"></sc-else>
          </div>
        </div>
      </div>
    </section>

    <!-- WORK -->
    <section id="work" style="{{ s.section }}">
      <div style="{{ s.wrap }}">
        <div style="{{ s.head }}">
          <div>
            <p class="rv" style="{{ s.kicker }}">{{ t.work.kicker }}</p>
            <h2 class="rv" style="{{ s.h2 }}">{{ t.work.title }}</h2>
            <p class="rv" style="{{ s.body }};margin-top:20px;max-width:46ch;">{{ t.work.intro }}</p>
          </div>
          <div role="group" aria-label="{{ t.work.filter }}" style="display:flex;flex-wrap:wrap;gap:8px;">
            <sc-for each="filters" as="fl"><button type="button" on-click="setFilter(fl.key)" aria-pressed="{{ fl.on ? 'true' : 'false' }}" style="{{ fl.on ? s.chipOn : s.chipOff }}">{{ fl.label }}<span style="opacity:.5;margin-left:8px;">{{ fl.count }}</span></button></sc-for>
          </div>
        </div>
        <div style="{{ s.gallery }}">
          <sc-for each="gallery" as="w">
            <figure data-key="{{ w.path }}" class="rv-wipe" style="{{ s.figure }}">
              <sc-if test="w.missing">
                <div data-slot="{{ w.path }}" role="button" tabindex="0" aria-label="{{ t.slot.drop }}: {{ w.path }}" style="{{ s.slot }};aspect-ratio:4/5;"><span>{{ t.slot.drop }}</span><span style="opacity:.6">{{ w.path }}</span></div>
              </sc-if>
              <sc-else>
                <button type="button" on-click="openLightbox(i)" aria-label="{{ t.work.open }}: {{ w.alt }}" style="{{ s.figBtn }}"><img src="{{ w.src }}" alt="{{ w.alt }}" loading="lazy" style="display:block;width:100%;height:auto;"></button>
              </sc-else>
              <figcaption style="{{ s.figcap }}"><span>{{ w.place }}</span><span>{{ w.catLabel }}</span></figcaption>
            </figure>
          </sc-for>
        </div>
      </div>
    </section>

    <!-- ABOUT -->
    <section id="about" style="{{ s.section }}">
      <div style="{{ s.wrap }}{{ s.aboutGrid }}">
        <div class="rv-photo" style="{{ s.aboutMedia }}">
          <sc-if test="aboutImg.missing">
            <div data-slot="{{ aboutImg.path }}" role="button" tabindex="0" aria-label="{{ t.slot.drop }}" style="{{ s.slot }}"><span>{{ t.slot.drop }}</span><span style="opacity:.6">{{ aboutImg.path }}</span></div>
          </sc-if>
          <sc-else><img src="{{ aboutImg.src }}" alt="{{ t.about.alt }}" loading="lazy" style="{{ s.cover }}"></sc-else>
        </div>
        <div>
          <p class="rv" style="{{ s.kicker }}">{{ t.about.kicker }}</p>
          <h2 class="rv" style="{{ s.h2 }}">{{ t.about.title }}</h2>
          <p class="rv" style="{{ s.lead }};margin-top:32px;">{{ t.about.lead }}</p>
          <sc-for each="t.about.body" as="para"><p class="rv" style="{{ s.body }};margin-top:20px;max-width:60ch;">{{ para }}</p></sc-for>
          <dl style="{{ s.facts }}">
            <sc-for each="t.about.facts" as="fact">
              <div class="rv-row" style="{{ s.fact }}">
                <dt style="{{ s.label }};margin-bottom:8px;">{{ fact.k }}</dt>
                <dd style="margin:0;font-size:16px;color:#F2F2F0;">{{ fact.v }}</dd>
              </div>
            </sc-for>
          </dl>
        </div>
      </div>
    </section>

    <!-- STYLES -->
    <section id="styles" style="{{ s.section }}">
      <div style="{{ s.wrap }}">
        <div style="{{ s.head }}">
          <div>
            <p class="rv" style="{{ s.kicker }}">{{ t.styles.kicker }}</p>
            <h2 class="rv" style="{{ s.h2 }}">{{ t.styles.title }}</h2>
          </div>
          <p class="rv" style="{{ s.body }};max-width:40ch;">{{ t.styles.intro }}</p>
        </div>
        <ol style="list-style:none;margin:0;padding:0;border-top:1px solid #1F1F1E;">
          <sc-for each="t.styles.items" as="it">
            <li class="rv-row" style="{{ s.row }}">
              <span style="{{ s.rowNum }}">0{{ i + 1 }}</span>
              <h3 style="{{ s.h3 }};font-size:{{ d ? 44 : 30 }}px;">{{ it.n }}</h3>
              <p style="{{ s.body }};{{ d ? '' : 'grid-column:2;' }}">{{ it.d }}</p>
            </li>
          </sc-for>
        </ol>
        <div class="rv" style="margin-top:48px;">
          <p style="{{ s.label }}">{{ t.styles.noTitle }}</p>
          <ul style="list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;">
            <sc-for each="t.styles.no" as="n"><li style="{{ s.tag }}">{{ n }}</li></sc-for>
          </ul>
        </div>
      </div>
    </section>

    <!-- PRICING -->
    <section id="pricing" style="{{ s.section }}">
      <div style="{{ s.wrap }}">
        <div style="{{ s.head }}">
          <div>
            <p class="rv" style="{{ s.kicker }}">{{ t.pricing.kicker }}</p>
            <h2 class="rv" style="{{ s.h2 }}">{{ t.pricing.title }}</h2>
          </div>
          <p class="rv" style="{{ s.body }};max-width:42ch;">{{ t.pricing.intro }}</p>
        </div>
        <div style="{{ s.rates }}">
          <sc-for each="t.pricing.rates" as="r">
            <div class="rv" style="{{ s.rate }}">
              <div>
                <p style="{{ s.label }};margin:0 0 6px;">{{ r.k }}</p>
                <p style="{{ s.small }}">{{ r.d }}</p>
              </div>
              <p style="{{ s.rateV }}">{{ r.v }}</p>
            </div>
          </sc-for>
        </div>
        <p class="rv" style="{{ s.small }};margin-top:24px;max-width:70ch;">{{ t.pricing.note }}</p>
      </div>
    </section>

    <!-- AFTERCARE -->
    <section id="aftercare" style="{{ s.section }}">
      <div style="{{ s.wrap }}">
        <div style="{{ s.head }}">
          <div>
            <p class="rv" style="{{ s.kicker }}">{{ t.aftercare.kicker }}</p>
            <h2 class="rv" style="{{ s.h2 }}">{{ t.aftercare.title }}</h2>
          </div>
          <p class="rv" style="{{ s.body }};max-width:42ch;">{{ t.aftercare.intro }}</p>
        </div>
        <ol style="{{ s.care }}">
          <sc-for each="t.aftercare.steps" as="c">
            <li class="rv" style="border-top:1px solid #1F1F1E;padding-top:22px;">
              <p style="{{ s.rowNum }};margin:0 0 14px;">0{{ i + 1 }}</p>
              <h3 style="{{ s.h3 }};font-size:{{ d ? 30 : 26 }}px;">{{ c.t }}</h3>
              <p style="{{ s.body }};margin-top:12px;">{{ c.d }}</p>
            </li>
          </sc-for>
        </ol>
        <div class="rv" role="note" style="{{ s.warn }}">
          <span aria-hidden="true" style="font-family:Anton,Impact,sans-serif;font-size:28px;line-height:1;color:#E0736B;">!</span>
          <div>
            <p style="{{ s.label }};color:#E0736B;margin-bottom:8px;">{{ t.aftercare.warnTitle }}</p>
            <p style="{{ s.body }};color:#D8D8D4;">{{ t.aftercare.warn }}</p>
          </div>
        </div>
      </div>
    </section>

    <!-- FAQ -->
    <section id="faq" style="{{ s.section }}">
      <div style="{{ s.wrap }}">
        <div style="{{ s.head }}">
          <div>
            <p class="rv" style="{{ s.kicker }}">{{ t.faq.kicker }}</p>
            <h2 class="rv" style="{{ s.h2 }}">{{ t.faq.title }}</h2>
          </div>
        </div>
        <div style="border-top:1px solid #1F1F1E;max-width:1000px;">
          <sc-for each="t.faq.items" as="q">
            <div class="rv-row" style="border-bottom:1px solid #1F1F1E;">
              <h3 style="margin:0;">
                <button type="button" id="faq-q{{ i }}" on-click="toggleFaq(i)" aria-expanded="{{ faqOpen === i ? 'true' : 'false' }}" aria-controls="faq-a{{ i }}" style="{{ s.faqBtn }}">
                  <span>{{ q.q }}</span>
                  <span aria-hidden="true" style="flex:none;font-size:26px;font-weight:300;transition:transform .25s;transform:rotate({{ faqOpen === i ? 45 : 0 }}deg);">+</span>
                </button>
              </h3>
              <sc-if test="faqOpen === i">
                <div id="faq-a{{ i }}" role="region" aria-labelledby="faq-q{{ i }}" class="sr-step" style="padding:0 0 28px;max-width:70ch;">
                  <p style="{{ s.body }}">{{ q.a }}</p>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </section>

    <!-- POLICIES -->
    <section id="policies" style="{{ s.section }}">
      <div style="{{ s.wrap }}">
        <div style="{{ s.head }}">
          <div>
            <p class="rv" style="{{ s.kicker }}">{{ t.policies.kicker }}</p>
            <h2 class="rv" style="{{ s.h2 }}">{{ t.policies.title }}</h2>
          </div>
          <p class="rv" style="{{ s.body }};max-width:42ch;">{{ t.policies.intro }}</p>
        </div>
        <div style="{{ s.policies }}">
          <sc-for each="t.policies.items" as="po">
            <div class="rv" style="padding:28px 0;border-top:1px solid #1F1F1E;">
              <h3 style="{{ s.h3 }};font-size:{{ d ? 28 : 24 }}px;">{{ po.t }}</h3>
              <p style="{{ s.body }};margin-top:12px;">{{ po.d }}</p>
            </div>
          </sc-for>
        </div>
      </div>
    </section>

    <!-- BOOKING -->
    <section id="book" style="{{ s.section }};background:#0D0D0D;">
      <div style="{{ s.wrap }}{{ s.bookGrid }}">
        <div style="{{ s.bookAside }}">
          <p class="rv" style="{{ s.kicker }}">{{ t.book.kicker }}</p>
          <h2 class="rv" style="{{ s.h2 }}">{{ t.book.title }}</h2>
          <p class="rv" style="{{ s.body }};margin-top:24px;max-width:42ch;">{{ bk.intro }}</p>
          <sc-if test="d && !status">
            <div style="margin-top:48px;">
              <p style="{{ s.label }}">{{ t.book.summary }}</p>
              <dl style="margin:0;border-top:1px solid #1F1F1E;">
                <sc-for each="summary" as="row">
                  <div style="{{ s.sumRow }}"><dt style="color:#6E6E6B;">{{ row.k }}</dt><dd style="margin:0;color:{{ row.empty ? '#3A3A38' : '#D8D8D4' }};overflow-wrap:anywhere;">{{ row.v }}</dd></div>
                </sc-for>
              </dl>
            </div>
          </sc-if>
        </div>

        <div id="book-form" style="{{ s.formWrap }}">
          <sc-if test="status">
            <div data-key="status-{{ status }}" class="sr-step" aria-live="polite" style="{{ s.statusBox }}">
              <sc-if test="status === 'sending'">
                <div style="display:flex;align-items:center;gap:16px;padding:40px 0;">
                  <svg class="sr-spin" width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="#2A2A28" stroke-width="2"></circle><path d="M22 12a10 10 0 0 0-10-10" stroke="#F2F2F0" stroke-width="2"></path></svg>
                  <p style="{{ s.lead }}">{{ bk.sending }}</p>
                </div>
              </sc-if>
              <sc-if test="status === 'booked' || status === 'delivered'">
                <svg class="sr-check" width="64" height="64" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" stroke="#8FBF8F" stroke-width="1"></circle><path d="M7 12.5l3.2 3.2L17 9" stroke="#8FBF8F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                <h3 style="{{ s.h3 }};font-size:{{ d ? 52 : 40 }}px;margin-top:24px;">{{ status === 'booked' ? t.book.bookedTitle : t.book.deliveredTitle }}</h3>
                <p style="{{ s.body }};margin-top:16px;max-width:52ch;">{{ status === 'booked' ? t.book.bookedText : t.book.deliveredText }}</p>
              </sc-if>
              <sc-if test="status === 'failed'">
                <h3 style="{{ s.h3 }};font-size:{{ d ? 52 : 40 }}px;color:#E0736B;">{{ t.book.failedTitle }}</h3>
                <p style="{{ s.body }};margin-top:16px;max-width:52ch;">{{ t.book.failedText }}</p>
                <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;">
                  <a href="{{ mailtoHref }}" style="{{ s.btn }}">{{ t.book.mailMe }}</a>
                  <a href="{{ IG_URL }}" target="_blank" rel="noopener" style="{{ s.btnGhost }}">{{ t.book.dm }}</a>
                  <button type="button" on-click="copyRequest()" style="{{ s.btnGhost }}">{{ copied ? t.book.copied : t.book.copy }}</button>
                </div>
              </sc-if>
              <sc-if test="status !== 'sending'">
                <dl style="margin:36px 0 0;border-top:1px solid #1F1F1E;">
                  <sc-for each="summary" as="row">
                    <div style="{{ s.sumRow }}"><dt style="color:#6E6E6B;">{{ row.k }}</dt><dd style="margin:0;color:#D8D8D4;overflow-wrap:anywhere;">{{ row.v }}</dd></div>
                  </sc-for>
                </dl>
                <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;">
                  <sc-if test="status === 'failed'"><button type="button" on-click="retry()" style="{{ s.btnGhost }}">← {{ t.book.edit }}</button></sc-if>
                  <button type="button" on-click="newRequest()" style="{{ s.btnGhost }}">{{ t.book.again }}</button>
                </div>
              </sc-if>
            </div>
          </sc-if>
          <sc-else>
            <ol aria-label="{{ t.book.title }}" style="{{ s.stepper }}">
              <sc-for each="stepper" as="sp"><li aria-current="{{ sp.on ? 'step' : 'false' }}" style="{{ sp.style }}"><span style="opacity:.6;">0{{ i + 1 }}</span> {{ sp.label }}</li></sc-for>
            </ol>
            <form on-submit="submitStep()" novalidate>
              <input type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" value="{{ f.company }}" on-input="setField('company')" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;">
              <div data-key="step-{{ step }}" class="sr-step">

                <sc-if test="step === 1">
                  <div style="{{ s.field }}">

/* ------------------------------------------------------------------ *
 * Time helpers — everything is computed in the studio time zone
 * ------------------------------------------------------------------ */
const tzFmt = new Intl.DateTimeFormat('en-CA', {
  timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
});

function tzParts(date) {
  const p = {};
  tzFmt.formatToParts(date).forEach(x => { p[x.type] = x.value; });
  return { y: +p.year, m: +p.month, d: +p.day, h: +p.hour % 24, min: +p.minute, s: +p.second };
}

const utcCache = new Map();
function zonedToUtc(y, m, d, h, min) {
  const key = `${y}-${m}-${d}-${h}-${min}`;
  if (utcCache.has(key)) return utcCache.get(key);
  const guess = Date.UTC(y, m - 1, d, h, min);
  const offsetAt = t => {
    const p = tzParts(new Date(t));
    return Date.UTC(p.y, p.m - 1, p.d, p.h, p.min, p.s) - t;
  };
  const first = guess - offsetAt(guess);
  const result = guess - offsetAt(first);
  utcCache.set(key, result);
  return result;
}

const pad2 = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;

function parseSlot(label) {
  const m = /^\s*(\d{1,2})\s*(?::|h)\s*(\d{2})?/i.exec(label) || [null, 11, 0];
  const l = label.toLowerCase();
  const hours = /full day|journée complète|journee complete/.test(l) ? 8 : /half day|demi/.test(l) ? 4 : 2;
  return { h: +m[1], min: +(m[2] || 0), hours };
}

function gcalStamp(ms) {
  return new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
}

function resizeImage(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * r));
      c.height = Math.max(1, Math.round(img.naturalHeight * r));
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const data = c.toDataURL('image/jpeg', 0.82);
      c.toBlob(blob => {
        resolve({ name: file.name.replace(/\.[^.]+$/, '') + '.jpg', data, thumb: URL.createObjectURL(blob || file) });
      }, 'image/jpeg', 0.7);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
    img.src = url;
  });
}

    ];
    this.catLabels = {
      cyber: { en: 'Cyber / sigil', fr: 'Cyber / sigil' },
      lettering: { en: 'Lettering', fr: 'Lettrage' }
    };
    this.heroSrc = 'img/w1.png';
    this.aboutSrc = 'img/w8.png';
    this.studioSrc = 'img/studio.png';

    let saved = null;
    try { saved = localStorage.getItem('sr_lang'); } catch (e) { /* storage blocked */ }
    const lang = saved === 'en' || saved === 'fr' ? saved : (props.lang === 'fr' ? 'fr' : 'en');
    const now = tzParts(new Date());

    this.mq = window.matchMedia('(min-width: 1080px)');
    this.busyByMonth = {};
    this.state = {
      lang,
      desktop: this.mq.matches,
      scrolled: false,
      menuOpen: false,
      filter: 'all',
      lightbox: -1,
      faqOpen: 0,
      bookVisible: false,
      step: 1,
      f: emptyForm(),
      photos: [],
      photoBusy: false,
      photoMsg: '',
      month: { y: now.y, m: now.m },
      date: '',
      slot: -1,
      busy: [],
      busyState: 'idle',
      err: {},
      status: '',
      takenMsg: false,
      copied: false
    };
    ImageSlot.onChange(() => this.update());
  }

  motionOff() {
    return !!this.props.reduceMotion || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  mounted() {
    this.applyLang();
    this.mq.addEventListener('change', e => this.setState({ desktop: e.matches, menuOpen: false }));

    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        const y = window.scrollY;
        const scrolled = y > 30;
        if (scrolled !== this.state.scrolled) this.setState({ scrolled });
        const par = this.motionOff() ? 0 : Math.min(y, 1400) * 0.12;
        document.documentElement.style.setProperty('--sr-par', par + 'px');
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    document.addEventListener('keydown', e => this.onKey(e));
    if (this.props.reduceMotion) document.documentElement.style.scrollBehavior = 'auto';
    this.loadBusy();
  }

  updated() {
    const book = document.getElementById('book');
    if (book && book !== this.bookEl && 'IntersectionObserver' in window) {
      this.bookEl = book;
      if (this.io) this.io.disconnect();
      this.io = new IntersectionObserver(entries => {
        const v = entries[0].isIntersecting;
        if (v !== this.state.bookVisible) this.setState({ bookVisible: v });
      }, { threshold: 0.05 });
      this.io.observe(book);
    }
    document.body.style.overflow = this.state.menuOpen || this.state.lightbox >= 0 ? 'hidden' : '';
  }

  applyLang() {
    const t = DICT[this.state.lang];
    document.documentElement.lang = this.state.lang === 'fr' ? 'fr-CA' : 'en-CA';
    document.title = t.meta.title;
    const desc = document.querySelector('meta[name="description"]');
    if (desc) desc.setAttribute('content', t.meta.desc);
  }

  /* ---------- site ---------- */
  setLang(lang) {
    try { localStorage.setItem('sr_lang', lang); } catch (e) { /* storage blocked */ }
    this.setState({ lang, err: {} });
    this.applyLang();
  }

  toggleMenu() { this.setState({ menuOpen: !this.state.menuOpen }); }
  closeMenu() { if (this.state.menuOpen) this.setState({ menuOpen: false }); }
  toggleFaq(i) { this.setState({ faqOpen: this.state.faqOpen === i ? -1 : i }); }

  onKey(e) {
    if (e.key === 'Escape') {
      if (this.state.lightbox >= 0) this.closeLightbox();
      else if (this.state.menuOpen) this.closeMenu();
    } else if (this.state.lightbox >= 0 && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      this.stepLightbox(e.key === 'ArrowRight' ? 1 : -1);
    }
  }

  /* ---------- gallery ---------- */
  setFilter(filter) { this.setState({ filter, lightbox: -1 }); }

  filtered() {
    return this.state.filter === 'all' ? this.works : this.works.filter(w => w.cat === this.state.filter);
  }

  openLightbox(i, e) {
    this.lastFocus = e && e.target ? e.target.closest('button') : null;
    this.setState({ lightbox: i });
  }

  closeLightbox() {
    this.setState({ lightbox: -1 });
    if (this.lastFocus) requestAnimationFrame(() => this.lastFocus && this.lastFocus.focus({ preventScroll: true }));
  }

  stepLightbox(dir) {
    const n = this.filtered().length;
    this.setState({ lightbox: (this.state.lightbox + dir + n) % n });
  }

  lbBackdrop(e) {
    if (e.target.tagName !== 'IMG' && !e.target.closest('[data-slot]')) this.closeLightbox();
  }

  /* ---------- booking form ---------- */
  setForm(patch, clear) {
    const err = Object.assign({}, this.state.err);
    (clear || Object.keys(patch)).forEach(k => delete err[k]);
    this.setState({ f: Object.assign({}, this.state.f, patch), err });
  }

  setField(key, e) { this.setForm({ [key]: e.target.value }); }

  pick(key, i) {
    const clear = [key];
    if (key === 'contact') clear.push('phone', 'instagram');
    this.setForm({ [key]: i }, clear);
  }

  toggleAck(i, e) {
    const acks = this.state.f.acks.slice();
    acks[i] = e.target.checked;
    this.setForm({ acks });
  }

  async addPhotos(e) {
    const input = e.target;
    const files = Array.from(input.files || []);
    input.value = '';
    if (!files.length) return;
    const b = DICT[this.state.lang].book;
    const photos = this.state.photos.slice();
    let msg = '';
    this.setState({ photoBusy: true, photoMsg: '' });
    for (const file of files) {
      if (photos.length >= 4) { msg = b.photoMax; break; }
      try { photos.push(await resizeImage(file, 1200)); } catch (err) { msg = b.photoErr; }
    }
    this.setState({ photos, photoBusy: false, photoMsg: msg });
  }

  removePhoto(i) {
    const photos = this.state.photos.slice();
    const [gone] = photos.splice(i, 1);
    if (gone) URL.revokeObjectURL(gone.thumb);
    this.setState({ photos, photoMsg: '' });
  }

  pickDate(key) {
    const err = Object.assign({}, this.state.err);
    delete err.date;
    this.setState({ date: key, slot: -1, takenMsg: false, err });
  }

  pickSlot(i) {
    const err = Object.assign({}, this.state.err);
    delete err.date;
    this.setState({ slot: i, takenMsg: false, err });
  }

  shiftMonth(dir) {
    const now = tzParts(new Date());
    let { y, m } = this.state.month;
    m += dir;
    if (m < 1) { m = 12; y--; }
    if (m > 12) { m = 1; y++; }
    const idx = y * 12 + m, min = now.y * 12 + now.m;
    if (idx < min || idx > min + 6) return;
    this.setState({ month: { y, m } });
    this.loadBusy();
  }

  async loadBusy() {
    const p = this.props;
    const source = p.bookingUrl ? 'script' : (p.gcalId && p.gcalKey ? 'gcal' : '');
    if (!source) return;
    const { y, m } = this.state.month;
    const key = `${y}-${m}`;
    if (this.busyByMonth[key]) return;
    const from = new Date(zonedToUtc(y, m, 1, 0, 0)).toISOString();
    const to = new Date(zonedToUtc(m === 12 ? y + 1 : y, m === 12 ? 1 : m + 1, 1, 0, 0)).toISOString();
    this.setState({ busyState: 'loading' });
    try {
      let busy;
      if (source === 'script') {
        const url = p.bookingUrl + (p.bookingUrl.includes('?') ? '&' : '?') +
          `action=busy&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;
        const j = await (await fetch(url)).json();
        if (!j.ok) throw new Error(j.error || 'busy failed');
        busy = (j.busy || []).map(x => [+x.start, +x.end]);
      } else {
        const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(p.gcalId)}/events` +
          `?key=${encodeURIComponent(p.gcalKey)}&timeMin=${encodeURIComponent(from)}&timeMax=${encodeURIComponent(to)}` +
          '&singleEvents=true&maxResults=250';
        const r = await fetch(url);
        if (!r.ok) throw new Error('gcal ' + r.status);
        const j = await r.json();
        busy = (j.items || [])
          .filter(ev => ev.status !== 'cancelled' && ev.transparency !== 'transparent')
          .map(ev => {
            if (ev.start.dateTime) return [Date.parse(ev.start.dateTime), Date.parse(ev.end.dateTime)];
            const [sy, sm, sd] = ev.start.date.split('-').map(Number);
            const [ey, em, ed] = ev.end.date.split('-').map(Number);
            return [zonedToUtc(sy, sm, sd, 0, 0), zonedToUtc(ey, em, ed, 0, 0)];
          });
      }
      this.busyByMonth[key] = busy;
      const all = [].concat(...Object.values(this.busyByMonth));
      this.setState({ busy: all, busyState: 'ok' });
    } catch (err) {
      console.warn('[skinreaper] availability', err);
      this.setState({ busyState: 'error' });
    }
  }

  slotsFor(dateKey) {
    if (!dateKey) return [];
    const [y, m, d] = dateKey.split('-').map(Number);
    const dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    const b = DICT[this.state.lang].book;
    const labels = dow === 6 ? b.slotsSat : (dow === 0 || dow === 1 ? [] : b.slotsWeek);
    const now = Date.now();
    return labels.map((label, i) => {
      const { h, min, hours } = parseSlot(label);
      const start = zonedToUtc(y, m, d, h, min);
      const end = start + hours * 3600e3;
      const blocked = start <= now || this.state.busy.some(x => x[0] < end && x[1] > start);
      return { i, label, start, end, hours, blocked };
    });
  }

  dateLabel(dateKey, opts) {
    if (!dateKey) return '';
    const [y, m, d] = dateKey.split('-').map(Number);
    const locale = this.state.lang === 'fr' ? 'fr-CA' : 'en-CA';
    return new Intl.DateTimeFormat(locale, Object.assign({ weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }, opts))
      .format(new Date(Date.UTC(y, m - 1, d)));
  }

  validate(step) {
    const st = this.state, f = st.f, b = DICT[st.lang].book;
    const err = {};
    if (step === 1) {
      if (f.idea.trim().length < 10) err.idea = b.err.idea;
      ['style', 'size', 'place', 'color', 'budget'].forEach(k => { if (f[k] < 0) err[k] = b.err.pick; });
    }
    if (step === 2) {
      const sl = this.slotsFor(st.date)[st.slot];
      if (!st.date || !sl) err.date = b.err.date;
      else if (sl.blocked) err.date = b.taken;
      if (f.first < 0) err.first = b.err.pick;
    }
    if (step === 3) {
      if (f.pregnant < 0) err.pregnant = b.err.pick;
      if (f.acks.some(a => !a)) err.acks = b.err.acks;
      if (!f.name.trim()) err.name = b.err.name;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim())) err.email = b.err.email;
      if (f.contact < 0) err.contact = b.err.pick;
      if ((f.contact === 1 || f.contact === 2) && f.phone.replace(/\D/g, '').length < 7) err.phone = b.err.phone;
      if (f.contact === 3 && f.instagram.replace(/[@\s]/g, '').length < 2) err.instagram = b.err.instagram;
    }
    return err;
  }

  submitStep() {
    const st = this.state;
    if (st.status) return;
    if (st.step === 3 && st.f.pregnant === 0) return;
    const err = this.validate(st.step);
    if (Object.keys(err).length) {
      this.setState({ err });
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const el = document.querySelector('#book-form [aria-invalid="true"]');
        if (el) el.scrollIntoView({ behavior: this.motionOff() ? 'auto' : 'smooth', block: 'center' });
      }));
      return;
    }
    if (st.step === 3) { this.send(); return; }
    this.setState({ step: st.step + 1, err: {} });
    this.scrollToForm();
  }

  prevStep() {
    this.setState({ step: Math.max(1, this.state.step - 1), err: {} });
    this.scrollToForm();
  }

  scrollToForm() {
    requestAnimationFrame(() => {
      const el = document.getElementById('book-form');
      if (el && el.getBoundingClientRect().top < 0) el.scrollIntoView({ behavior: this.motionOff() ? 'auto' : 'smooth', block: 'start' });
    });
  }

  selectedSlot() {
    return this.slotsFor(this.state.date)[this.state.slot] || null;
  }

  summaryRows() {
    const st = this.state, f = st.f, b = DICT[st.lang].book;
    const sl = this.selectedSlot();
    const opt = (list, i) => (i >= 0 ? list[i] : '');
    const rows = [
      { k: b.idea, v: f.idea.trim() },
      { k: b.style, v: opt(b.styles, f.style) },
      { k: b.size, v: opt(b.sizes, f.size) },
      { k: b.place, v: opt(b.places, f.place) },
      { k: b.color, v: opt(b.colors, f.color) },
      { k: b.budget, v: opt(b.budgets, f.budget) },
      { k: b.sumPhotos, v: st.photos.length ? String(st.photos.length) : '' },
      { k: b.sumDate, v: this.dateLabel(st.date, { year: 'numeric' }) },
      { k: b.sumTime, v: sl ? sl.label : '' },
      { k: b.first, v: opt(b.yesNo, f.first) },
      { k: b.sumName, v: f.name.trim() },
      { k: b.email, v: f.email.trim() },
      { k: b.phone, v: f.phone.trim() },
      { k: b.instagram, v: f.instagram.trim() },
      { k: b.contact, v: opt(b.contacts, f.contact) }
    ];
    return rows.map(r => ({ k: r.k, v: r.v || '—', empty: !r.v }));
  }

  summaryText() {
    const b = DICT[this.state.lang].book;
    return b.mailSubject + '\n\n' + this.summaryRows().filter(r => !r.empty).map(r => `${r.k}: ${r.v}`).join('\n') +
      (this.state.photos.length ? `\n\n${this.state.photos.length} ${b.photosNote}` : '');
  }

  calendarLink(sl) {
    const f = this.state.f;
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      `&text=${encodeURIComponent('Tattoo — ' + f.name.trim())}` +
      `&dates=${gcalStamp(sl.start)}/${gcalStamp(sl.end)}` +
      `&details=${encodeURIComponent(this.summaryText())}` +
      `&location=${encodeURIComponent(LOCATION)}&ctz=${encodeURIComponent(TZ)}`;
  }

  payload() {
    const st = this.state, f = st.f, b = DICT[st.lang].book;
    const sl = this.selectedSlot();
    return {
      lang: st.lang,
      idea: f.idea.trim(),
      style: b.styles[f.style],
      size: b.sizes[f.size],
      placement: b.places[f.place],
      ink: b.colors[f.color],
      budget: b.budgets[f.budget],
      date: st.date,
      slot: sl.label,
      start: new Date(sl.start).toISOString(),
      end: new Date(sl.end).toISOString(),
      hours: sl.hours,
      dateLabel: this.dateLabel(st.date, { year: 'numeric' }),
      firstTattoo: b.yesNo[f.first],
      pregnant: f.pregnant === 0,
      acknowledged: f.acks.every(Boolean),
      name: f.name.trim(),
      email: f.email.trim(),
      phone: f.phone.trim(),
      instagram: f.instagram.trim(),
      contact: b.contacts[f.contact],
      photos: st.photos.map(ph => ({ name: ph.name, type: 'image/jpeg', data: ph.data.split(',')[1] })),
      company: f.company,
      tz: TZ,
      page: location.href
    };
  }

  async send() {
    const p = this.props;
    const data = this.payload();
    const sl = this.selectedSlot();
    this.setState({ status: 'sending', err: {}, copied: false });
    this.scrollToForm();
    try {
      if (p.bookingUrl) {
        const r = await fetch(p.bookingUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        });
        const j = await r.json();
        if (j.ok) {
          this.busyByMonth = {};
          this.setState({ status: 'booked' });
          return;
        }
        if (j.error === 'slot_taken') {
          this.busyByMonth = {};
          this.setState({ status: '', step: 2, slot: -1, takenMsg: true });
          this.loadBusy();
          this.scrollToForm();
          return;
        }
        throw new Error(j.error || 'booking failed');
      }

      if (!p.formEndpoint) throw new Error('no endpoint');
      const body = {
        _subject: `${DICT.en.book.mailSubject} — ${data.name} — ${data.dateLabel}, ${data.slot}`,
        _template: 'table',
        _captcha: 'false',
        _replyto: data.email,
        _honey: data.company,
        Name: data.name,
        Email: data.email,
        Phone: data.phone || '—',
        Instagram: data.instagram || '—',
        'Preferred contact': data.contact,
        Date: data.dateLabel,
        Time: `${data.slot} (${data.hours} h, ${TZ})`,
        'First tattoo': data.firstTattoo,
        Idea: data.idea,
        Style: data.style,
        Size: data.size,
        Placement: data.placement,
        Ink: data.ink,
        Budget: data.budget,
        'Reference photos': data.photos.length ? `${data.photos.length} chosen, ask the client to send them` : 'None',
        'Add to my calendar': this.calendarLink(sl),
        Language: data.lang === 'fr' ? 'Français' : 'English'
      };
      const r = await fetch(p.formEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(body)
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.success === false || j.success === 'false') throw new Error(j.message || 'form endpoint failed');
      this.setState({ status: 'delivered' });
    } catch (err) {
      console.warn('[skinreaper] send', err);
      this.setState({ status: 'failed' });
    }
  }

  async copyRequest() {
    const text = this.summaryText();
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e2) { /* nothing else to try */ }
      ta.remove();
    }
    this.setState({ copied: true });
    clearTimeout(this.copyTimer);
    this.copyTimer = setTimeout(() => this.setState({ copied: false }), 2500);
  }

  retry() { this.setState({ status: '', step: 3 }); }

  newRequest() {
    this.state.photos.forEach(ph => URL.revokeObjectURL(ph.thumb));
    this.setState({ status: '', step: 1, f: emptyForm(), photos: [], photoMsg: '', date: '', slot: -1, err: {}, takenMsg: false, copied: false });
    this.scrollToForm();
  }

  /* ---------- values for the template ---------- */
  renderVals() {
    const st = this.state, p = this.props, d = st.desktop, lang = st.lang;
    const t = DICT[lang], b = t.book;
    const s = makeStyles(d);
    const auto = !!p.bookingUrl;
    const bk = auto ? Object.assign({ intro: b.intro, send: b.send, sending: b.sending }, AUTO[lang]) : { intro: b.intro, send: b.send, sending: b.sending };

    const navStyle = `position:fixed;top:0;left:0;right:0;z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid ${st.scrolled && !st.menuOpen ? '#1A1A1A' : 'transparent'};` +
      `background:${st.scrolled || st.menuOpen ? 'rgba(10,10,10,.9)' : 'transparent'};` +
      (st.scrolled && !st.menuOpen ? '-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);' : '');

    const ids = ['work', 'about', 'styles', 'pricing', 'aftercare', 'faq', 'policies', 'studio'];
    const navMobile = ids.concat('book').map(id => ({ id, label: t.nav[id] }));
    const navDesktop = ['work', 'about', 'styles', 'pricing', 'faq', 'studio'].map(id => ({ id, label: t.nav[id] }));

    const img = path => ({ path, src: ImageSlot.src(path), missing: ImageSlot.missing(path) });
    const works = this.works.map(w => Object.assign(img(w.src), {
      cat: w.cat,
      place: w.place[lang],
      catLabel: this.catLabels[w.cat][lang],
      alt: `${t.work.alt}, ${w.place[lang].toLowerCase()}`
    }));
    const gallery = st.filter === 'all' ? works : works.filter(w => w.cat === st.filter);
    const filters = [{ key: 'all', label: t.work.all, count: works.length }]
      .concat(Object.keys(this.catLabels).map(k => ({ key: k, label: this.catLabels[k][lang], count: works.filter(w => w.cat === k).length })))
      .map(fl => Object.assign(fl, { on: fl.key === st.filter }));
    const lb = st.lightbox >= 0 && gallery[st.lightbox]
      ? Object.assign({}, gallery[st.lightbox], { n: st.lightbox + 1, total: gallery.length })
      : null;

    /* calendar */
    const now = tzParts(new Date());
    const todayKey = ymd(now.y, now.m, now.d);
    const { y, m } = st.month;
    const firstDow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    const nDays = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const cells = [];
    for (let k = 0; k < (firstDow + 6) % 7; k++) cells.push({ blank: true });
    for (let day = 1; day <= nDays; day++) {
      const key = ymd(y, m, day);
      const dow = new Date(Date.UTC(y, m - 1, day)).getUTCDay();
      const closed = dow === 0 || dow === 1;
      const past = key < todayKey;
      const full = !closed && !past && this.slotsFor(key).every(x => x.blocked);
      const disabled = closed || past || full;
      const selected = st.date === key;
      const isToday = key === todayKey;
      const style = 'height:44px;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-size:15px;font-weight:500;' +
        (selected ? 'background:#F2F2F0;color:#0A0A0A;border:1px solid #F2F2F0;cursor:pointer;'
          : disabled ? `background:transparent;color:#3A3A38;border:1px solid transparent;cursor:default;${full ? 'text-decoration:line-through;' : ''}`
          : 'background:transparent;color:#F2F2F0;border:1px solid #2A2A28;cursor:pointer;') +
        (isToday && !selected ? 'box-shadow:inset 0 -2px 0 #8C8C88;' : '');
      const aria = this.dateLabel(key) + (closed ? `, ${b.closed}` : full ? `, ${b.fullDay}` : '');
      cells.push({ day, key, disabled, selected, style, aria });
    }
    const monthIdx = y * 12 + m, minIdx = now.y * 12 + now.m;
    const cal = {
      key: `${y}-${m}`,
      title: new Intl.DateTimeFormat(lang === 'fr' ? 'fr-CA' : 'en-CA', { month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(Date.UTC(y, m - 1, 1))),
      canPrev: monthIdx > minIdx,
      canNext: monthIdx < minIdx + 6,
      cells
    };

    const slots = this.slotsFor(st.date).map(x => Object.assign(x, {
      on: x.i === st.slot,
      style: 'min-height:52px;padding:10px 14px;font-family:Archivo,sans-serif;font-size:15px;font-weight:500;text-align:left;' +
        (x.i === st.slot ? 'background:#F2F2F0;color:#0A0A0A;border:1px solid #F2F2F0;cursor:pointer;'
          : x.blocked ? 'background:transparent;color:#3A3A38;border:1px solid #1A1A1A;cursor:default;text-decoration:line-through;'
          : 'background:transparent;color:#F2F2F0;border:1px solid #2A2A28;cursor:pointer;')
    }));
    const isSat = st.date && new Date(st.date + 'T12:00:00Z').getUTCDay() === 6;
    const slotGrid = `display:grid;grid-template-columns:${isSat ? '1fr' : `repeat(${d ? 3 : 2},1fr)`};gap:8px;`;

    /* form groups */
    const f = st.f;
    const group = (key, label, list) => ({ key, label, options: list.map((o, i) => ({ i, label: o, on: f[key] === i })) });
    const groups1 = [
      group('style', b.style, b.styles),
      group('size', b.size, b.sizes),
      group('place', b.place, b.places),
      group('color', b.color, b.colors),
      group('budget', b.budget, b.budgets)
    ];
    const groups2 = [group('first', b.first, b.yesNo)];
    const groups3a = [group('pregnant', b.pregnant, b.yesNo)];
    const groups3b = [group('contact', b.contact, b.contacts)];
    const acks = b.acks.map((label, i) => ({ label, on: f.acks[i] }));
    const needPhone = f.contact === 1 || f.contact === 2;
    const needIg = f.contact === 3;
    const inputs = [
      { key: 'name', label: b.name, type: 'text', auto: 'name', mode: 'text', ph: '', req: true },
      { key: 'email', label: b.email, type: 'email', auto: 'email', mode: 'email', ph: '', req: true },
      { key: 'phone', label: b.phone, type: 'tel', auto: 'tel', mode: 'tel', ph: '', req: needPhone },
      { key: 'instagram', label: b.instagram, type: 'text', auto: 'off', mode: 'text', ph: b.igPh, req: needIg }
    ].map(x => Object.assign(x, { value: f[x.key], err: st.err[x.key] || '' }));

    const stepper = b.steps.map((label, i) => {
      const n = i + 1, on = n === st.step, done = n < st.step;
      return {
        label, on,
        style: `padding-top:12px;border-top:2px solid ${on ? '#F2F2F0' : done ? '#6E6E6B' : '#2A2A28'};font-size:${d ? 12 : 11}px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:${on ? '#F2F2F0' : done ? '#A6A6A2' : '#6E6E6B'};`
      };
    });

    const summary = this.summaryRows();
    const mailtoHref = st.status === 'failed'
      ? `mailto:${EMAIL}?subject=${encodeURIComponent(b.mailSubject + ' — ' + f.name.trim())}&body=${encodeURIComponent(this.summaryText().slice(0, 1800))}`
      : '';

    return {
      t, s, d, bk, auto, navStyle, navMobile, navDesktop,
      rootClass: p.reduceMotion ? 'sr-rm' : '',
      EMAIL, IG_URL, MAPS_URL,
      heroImg: img(this.heroSrc),
      aboutImg: img(this.aboutSrc),
      studioImg: img(this.studioSrc),
      gallery, filters, lb,
      cal, slots, slotGrid,
      dateLabel: this.dateLabel(st.date),
      groups1, groups2, groups3a, groups3b, acks, inputs, stepper,
      blocked: st.step === 3 && f.pregnant === 0,
      hasErr: Object.keys(st.err).length > 0,
      summary, mailtoHref,
      showBar: !d && !st.bookVisible && !st.menuOpen && !lb
    };
  }
}

DC.mount(Component, document.querySelector('x-dc'), PROPS);
</script>
